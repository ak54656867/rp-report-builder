<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RP 보고서 작성기</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b2e;--line:#293650;--text:#edf2ff;--muted:#9ba9c3;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172747,#0b1020 55%);font-family:system-ui,sans-serif;color:var(--text);padding:28px 16px}.wrap{max-width:1050px;margin:auto}header{margin-bottom:22px}h1{font-size:27px;margin:0 0 7px}header p,.hint{color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(19,27,46,.96);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}h2{font-size:17px;margin:0 0 17px}.field{margin-bottom:14px}label{display:block;font-size:13px;color:#b8c6df;margin-bottom:7px}input,select,textarea{width:100%;background:#0d1526;border:1px solid #34435f;border-radius:9px;color:var(--text);padding:11px 12px;font:inherit}textarea{min-height:76px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actions button,.output-head button{border:1px solid #3a4d70;background:#1a2944;color:var(--text);border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:650}.actions .primary{background:var(--blue);border-color:var(--blue)}.outputs{display:grid;gap:14px}.output-card{background:#0d1526;border:1px solid #34435f;border-radius:12px;padding:14px}.output-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.output-head strong{font-size:14px}.output-card textarea{min-height:190px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.55}.hint,.status{font-size:12px;margin-top:8px}.status{color:#8fd5a8;min-height:18px}@media(max-width:760px){.layout{grid-template-columns:1fr}body{padding:18px 12px}.card{padding:16px}}
</style></head><body><main class="wrap"><header><h1>RP 보고서 작성기</h1><p>정보를 한 번 입력하면 진급·강등 요청과 부대 전출입 요청 양식을 동시에 생성합니다.</p></header>
<section class="card"><h2>게임 및 작성자 정보</h2><div class="two"><div class="field"><label for="game">RP 게임 / 서버</label><select id="game"><option value="논산">논산</option></select></div><div class="field"><label for="reporter">작성자 로블록스 닉네임</label><input id="reporter" placeholder="작성자 닉네임"></div></div><div class="field"><label for="reporterRank">작성자 계급</label><input id="reporterRank" placeholder="예: 대위"></div><div class="hint">작성자 닉네임과 계급은 게임별로 이 브라우저에 자동 저장됩니다.</div></section>
<div class="layout"><section class="card"><h2>보고 내용 입력</h2><div class="field"><label for="target">대상자 로블록스 닉네임</label><input id="target" placeholder="대상자 닉네임"></div><div class="two"><div class="field"><label for="currentRank">현 계급</label><input id="currentRank" placeholder="예: 상사"></div><div class="field"><label for="nextRank">후 계급</label><input id="nextRank" placeholder="예: 소위"></div></div><div class="field"><label for="reason">보고 사유</label><textarea id="reason" placeholder="예: 현장임관 / 모집공고 합격"></textarea></div><div class="two"><div class="field"><label for="fromUnit">기존 부대</label><select id="fromUnit"><option>No div</option><option>1st SFB</option><option>MP</option><option>13th SMB</option></select></div><div class="field"><label for="toUnit">변경 부대</label><select id="toUnit"><option>1st SFB</option><option>No div</option><option>MP</option><option>13th SMB</option></select></div></div><div class="actions"><button class="primary" id="generate">두 보고서 동시에 생성</button><button id="reset">보고 내용 초기화</button></div><div class="status" id="status" aria-live="polite"></div></section>
<section class="card"><h2>생성된 보고서</h2><div class="outputs"><div class="output-card"><div class="output-head"><strong>진급·강등 요청</strong><button data-copy="rankOutput">이 보고서 복사</button></div><textarea id="rankOutput" readonly placeholder="보고서를 생성하면 여기에 표시됩니다."></textarea></div><div class="output-card"><div class="output-head"><strong>부대 전출입 요청</strong><button data-copy="transferOutput">이 보고서 복사</button></div><textarea id="transferOutput" readonly placeholder="보고서를 생성하면 여기에 표시됩니다."></textarea></div><div class="actions"><button class="primary" id="copyAll">두 보고서 모두 복사</button></div></div></section></div></main>
<script>
(()=>{const $=id=>document.getElementById(id);const mentions='<@545602631540670474>\n<@677527082313711646>\n<@1221350330491605013>';const key=()=> 'rp-report-author-v1:'+ $('game').value;
function load(){try{const v=JSON.parse(localStorage.getItem(key())||'{}');$('reporter').value=v.name||'';$('reporterRank').value=v.rank||''}catch{$('reporter').value='';$('reporterRank').value=''}}
function save(){try{localStorage.setItem(key(),JSON.stringify({name:$('reporter').value,rank:$('reporterRank').value}))}catch{}}
$('game').addEventListener('change',load);$('reporter').addEventListener('input',save);$('reporterRank').addEventListener('input',save);load();
function action(a,b){const ranks=['훈련병','이병','일병','상병','병장','하사','중사','상사','원사','준위','소위','중위','대위','소령','중령','대령','준장','소장','중장','대장'];const x=ranks.indexOf(a),y=ranks.indexOf(b);return x>=0&&y>=0?(y>x?'진급':y<x?'강등':'계급변경'):'진급 / 강등'}
$('generate').addEventListener('click',()=>{const game=$('game').value,author=$('reporter').value.trim(),ar=$('reporterRank').value.trim(),target=$('target').value.trim(),cur=$('currentRank').value.trim(),next=$('nextRank').value.trim(),reason=$('reason').value.trim(),from=$('fromUnit').value,to=$('toUnit').value;
if(!author||!ar||!target||!cur||!next||!reason){$('status').textContent='작성자 닉네임·계급, 대상자 닉네임, 현·후 계급, 사유를 모두 입력해 주세요.';return}if(from===to){$('status').textContent='기존 부대와 변경 부대를 서로 다르게 선택해 주세요.';return}save();const who='작성자 : '+author+' / '+ar;
$('rankOutput').value='['+game+'] 본서버 진급강등요청 :\n'+who+'\n대상자 : '+target+'\n'+action(cur,next)+' 사유 : '+reason+'\n['+cur+'] -> ['+next+']\n'+mentions;
$('transferOutput').value='['+game+'] 본서버 부대전출입 요청 :\n'+who+'\n대상자 : '+target+'\n전출입 사유 : '+reason+'\n['+from+'] -> ['+to+']\n'+mentions;$('status').textContent='두 보고서가 모두 생성되었습니다.'});
async function copy(v){try{await navigator.clipboard.writeText(v);return true}catch{return false}}
document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{const el=$(b.dataset.copy);if(!el.value){$('status').textContent='먼저 보고서를 생성해 주세요.';return}if(await copy(el.value))$('status').textContent='보고서가 복사되었습니다.';else{el.focus();el.select();$('status').textContent='자동 복사가 제한되었습니다. 선택된 내용을 복사해 주세요.'}}));
$('copyAll').addEventListener('click',async()=>{const a=$('rankOutput').value,b=$('transferOutput').value;if(!a||!b){$('status').textContent='먼저 두 보고서를 생성해 주세요.';return}const all=a+'\n\n'+b;if(await copy(all))$('status').textContent='두 보고서가 한 번에 복사되었습니다.';else{$('rankOutput').value=all;$('rankOutput').focus();$('rankOutput').select();$('status').textContent='두 보고서를 합쳐 선택했습니다. 직접 복사해 주세요.'}});
$('reset').addEventListener('click',()=>{['target','currentRank','nextRank','reason'].forEach(id=>$(id).value='');$('fromUnit').value='No div';$('toUnit').value='1st SFB';$('rankOutput').value='';$('transferOutput').value='';$('status').textContent='보고 내용이 초기화되었습니다. 작성자 정보는 저장되어 있습니다.'});
})();
</script></body></html>
